name: wallpaper
description: A simple wallpaper app by ablinfotech.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.0+5

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_staggered_grid_view: ^0.7.0
  http: ^1.2.2
  flutter_snake_navigationbar: ^0.6.1
  sign_in_button: ^5.0.0
  cached_network_image: ^3.4.1
  fluttertoast: ^9.1.0
  hexcolor: ^3.0.1
  url_launcher: ^6.3.1
  async_wallpaper: ^3.1.0
  flutter_cache_manager: ^3.4.1
  gal: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf

    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript-Regular.ttf
